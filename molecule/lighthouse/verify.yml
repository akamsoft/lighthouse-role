---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check nginx service
      ansible.builtin.command: systemctl is-active nginx
      register: nginx_status
      changed_when: false
      failed_when: false

    - name: Assert nginx is running
      ansible.builtin.assert:
        that:
          - nginx_status.stdout == "active"
        fail_msg: "Nginx is not running: {{ nginx_status.stdout }}"

    - name: Check lighthouse index page
      ansible.builtin.uri:
        url: "http://localhost:8080/"
        status_code: 200
        return_content: true
      register: lighthouse_page

    - name: Assert lighthouse page contains expected content
      ansible.builtin.assert:
        that:
          - "'LightHouse' in lighthouse_page.content"
        fail_msg: "LightHouse page does not contain expected content"
